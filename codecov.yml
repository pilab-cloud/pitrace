# Codecov configuration
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        # Fail PRs that drop project coverage below 70% (with 2% grace).
        target: 70%
        threshold: 2%
    patch:
      default:
        target: 80%

# Ignore generated code and tests from coverage accounting.
ignore:
  - "gen/**"
  - "**/*_test.go"