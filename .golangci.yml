version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gosec
    - errorlint
    - revive
    - copyloopvar
    - nolintlint
    - goconst
    - gocritic
  settings:
    gosec:
      excludes:
        - G115
    revive:
      rules:
        - name: exported
        - name: var-naming
    nolintlint:
      require-explanation: true
      allow-unused: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - revive
          - goconst
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
