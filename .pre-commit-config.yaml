fail_fast: true

repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'unformatted=$(gofmt -l .); if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi'
        language: system
        files: \.go$
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint (fast mode)
        entry: golangci-lint run --fast-only
        language: system
        files: \.go$
        pass_filenames: false

  - repo: local
    hooks:
      - id: commitlint
        name: commitlint
        entry: go run github.com/paalgyula/commitlint@latest lint
        language: system
        stages: [commit-msg]
        pass_filenames: true